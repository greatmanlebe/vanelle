<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Valentine 💘</title>
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>

<div class="card">
    <h1>💖 A mon amour , VANELLE  💖</h1>
    <p id="question">« Mon amour, mon cœur, ma vie, depuis que je te connais, j’ai passé les meilleurs moments de ma vie.
Tu as toujours été là pour moi, et je suis vraiment très heureux de t’avoir.
Je t’aime, mon amour, et je voudrais que tu sois ma Valentine. »</p>

    <div class="buttons" id="img">
        <button class="yes" id="yesBtn">Oui 💕</button>
        <br>
        <button class="no" id="noBtn">Non 😅</button>
    </div>
<img id="valentineImg" src="us.png" alt="Nous deux 💕">
    <p class="message" id="message"></p>
</div>

<script src="script.js"></script>
</body>
</html>
